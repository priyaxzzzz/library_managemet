<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageTurn Library - Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f6efe4, #d8c3a5);
            padding: 25px;
        }

        .register-card {
            width: 950px;
            max-width: 100%;
            display: flex;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
        }

        .form-section {
            width: 55%;
            padding: 40px 45px;
        }

        .logo {
            color: #8b5e34;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            color: #30251f;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .field {
            flex: 1;
            min-width: 0;
        }

        label {
            display: block;
            color: #493b32;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6c8b8;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            margin-bottom: 17px;
        }

        input:focus {
            border-color: #8b5e34;
            box-shadow: 0 0 5px rgba(139, 94, 52, 0.2);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #8b5e34;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            background: #5f3d20;
            transform: translateY(-2px);
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        .login-text a {
            color: #8b5e34;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .image-section {
            width: 45%;
            min-height: 570px;
            position: relative;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-text {
            position: absolute;
            bottom: 25px;
            left: 20px;
            right: 20px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            text-align: center;
        }

        .image-text h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .image-text p {
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 750px) {
            .register-card {
                flex-direction: column;
            }

            .form-section {
                width: 100%;
                padding: 30px 25px;
            }

            .image-section {
                width: 100%;
                min-height: 250px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <div class="register-card">

        <div class="form-section">

            <div class="logo">📚 PageTurn Library</div>

            <h1>Create Your Account</h1>

            <p class="subtitle">
                Register your account to access the library.
            </p>

            <form id="registerForm" onsubmit="registerUser(event)">

                <div class="row">
                    <div class="field">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName"
                               placeholder="Enter first name" required>
                    </div>

                    <div class="field">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName"
                               placeholder="Enter last name" required>
                    </div>
                </div>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>

                <label for="username">Username</label>
                <input type="text" id="username"
                       placeholder="Choose a username" required>

                <div class="row">
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password"
                               placeholder="Create password" required>
                    </div>

                    <div class="field">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword"
                               placeholder="Confirm password" required>
                    </div>
                </div>

                <button type="submit" class="register-btn">
                    Create Account →
                </button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Login Here</a>
            </p>

        </div>

        <div class="image-section">
            <img
                src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?auto=format&fit=crop&w=900&q=80"
                alt="Books and Library">

            <div class="image-text">
                <h2>📖 Your Next Chapter Awaits</h2>
                <p>
                    Create your account and explore a world
                    of knowledge and imagination.
                </p>
            </div>
        </div>

    </div>

    <script>
        function registerUser(event) {
            event.preventDefault();

            let firstName =
                document.getElementById("firstName").value.trim();

            let lastName =
                document.getElementById("lastName").value.trim();

            let email =
                document.getElementById("email").value.trim();

            let username =
                document.getElementById("username").value.trim();

            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("❌ Passwords do not match!");
                return;
            }

            let users = JSON.parse(
                localStorage.getItem("registeredUsers") || "[]"
            );

            let existingUser = users.find(function(user) {
                return user.username.toLowerCase() ===
                    username.toLowerCase();
            });

            if (existingUser) {
                alert("❌ Username already exists! Choose another.");
                return;
            }

            let newUser = {
                firstName: firstName,
                lastName: lastName,
                email: email,
                username: username,
                password: password
            };

            users.push(newUser);

            localStorage.setItem(
                "registeredUsers",
                JSON.stringify(users)
            );

            alert("✅ Registration successful! Please login.");

            window.location.href = "login.html";
        }
    </script>

</body>
</html>
