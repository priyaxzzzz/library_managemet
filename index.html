
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PageTurn Library</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #f6efe4, #d8c3a5);
        }


        /* Main Card */

        .card {
            width: 950px;
            min-height: 500px;

            background: white;

            display: flex;
            align-items: center;

            border-radius: 25px;

            overflow: hidden;

            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
        }


        /* Left Content */

        .content {
            width: 55%;
            padding: 55px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #8b5e34;

            margin-bottom: 35px;
        }

        .tagline {
            color: #b27b42;

            font-size: 14px;
            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 15px;
        }

        h1 {
            font-size: 48px;
            line-height: 1.2;

            color: #30251f;

            margin-bottom: 20px;
        }

        h1 span {
            color: #a66a2c;
        }

        .description {
            color: #6b625c;

            font-size: 16px;

            line-height: 1.7;

            margin-bottom: 30px;
        }


        /* Button */

        .btn {
            display: inline-block;

            text-decoration: none;

            background: #8b5e34;
            color: white;

            padding: 14px 28px;

            border-radius: 30px;

            font-size: 16px;
            font-weight: bold;

            transition: 0.3s;
        }

        .btn:hover {
            background: #5f3d20;

            transform: translateY(-3px);
        }


        /* Right Image */

        .image-box {
            width: 45%;
            height: 500px;
        }

        .image-box img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* Small Features */

        .features {
            display: flex;

            gap: 20px;

            margin-bottom: 30px;
        }

        .feature {
            color: #51463f;

            font-size: 14px;
        }


        /* Responsive */

        @media (max-width: 800px) {

            .card {
                width: 90%;

                flex-direction: column;
            }

            .content {
                width: 100%;

                padding: 40px;

                text-align: center;
            }

            .image-box {
                width: 100%;
                height: 350px;
            }

            h1 {
                font-size: 38px;
            }

            .features {
                justify-content: center;
            }
        }

    </style>

</head>


<body>

    <div class="card">

        <!-- LEFT SIDE -->

        <div class="content">

            <div class="logo">
                📚 PageTurn Library
            </div>

            <p class="tagline">
                DISCOVER • READ • IMAGINE
            </p>

            <h1>
                Every Book Has
                <span>A Story.</span>
            </h1>

            <p class="description">
                Step into a world of knowledge and imagination.
                Explore thousands of stories, discover new ideas,
                and find the perfect book for your next adventure.
            </p>


            <div class="features">

                <div class="feature">
                    📖 Easy Reading
                </div>

                <div class="feature">
                    🔖 Save Books
                </div>

                <div class="feature">
                    ⭐ Favorites
                </div>

            </div>


            <a href="login.html" class="btn">
                Explore Library →
            </a>

        </div>


        <!-- RIGHT SIDE IMAGE -->

        <div class="image-box">

            <img
                src="https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=900&q=80"
                alt="Beautiful Library">

        </div>

    </div>

</body>

</html>
