<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageTurn Library - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f6efe4, #d8c3a5);
            padding: 20px;
        }

        .login-card {
            width: 900px;
            max-width: 100%;
            min-height: 500px;
            display: flex;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
        }

        .form-section {
            width: 55%;
            padding: 55px 45px;
        }

        .logo {
            color: #8b5e34;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        h1 {
            color: #30251f;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #493b32;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6c8b8;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            margin-bottom: 22px;
        }

        input:focus {
            border-color: #8b5e34;
            box-shadow: 0 0 5px rgba(139, 94, 52, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #8b5e34;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #5f3d20;
            transform: translateY(-2px);
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .register-text a {
            color: #8b5e34;
            font-weight: bold;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .image-section {
            width: 45%;
            position: relative;
            min-height: 500px;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-text {
            position: absolute;
            bottom: 25px;
            left: 20px;
            right: 20px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            text-align: center;
        }

        .image-text h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .image-text p {
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 750px) {
            .login-card {
                flex-direction: column;
            }

            .form-section {
                width: 100%;
                padding: 35px 25px;
            }

            .image-section {
                width: 100%;
                min-height: 250px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="form-section">

            <div class="logo">📚 PageTurn Library</div>

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login with the username and password you registered.
            </p>

            <form id="loginForm" onsubmit="loginUser(event)">

                <label for="username">Username</label>
                <input type="text" id="username"
                       placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Enter your password" required>

                <button type="submit" class="login-btn">
                    Login →
                </button>

            </form>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Register Here</a>
            </p>

        </div>

        <div class="image-section">
            <img
                src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?auto=format&fit=crop&w=900&q=80"
                alt="Books and Library">

            <div class="image-text">
                <h2>📚 Welcome to PageTurn</h2>
                <p>
                    Your next great read is waiting for you.
                </p>
            </div>
        </div>

    </div>

    <script>
        function loginUser(event) {
            event.preventDefault();

            let username =
                document.getElementById("username").value.trim();

            let password =
                document.getElementById("password").value;

            let users = JSON.parse(
                localStorage.getItem("registeredUsers") || "[]"
            );

            let user = users.find(function(item) {
                return item.username.toLowerCase() ===
                    username.toLowerCase()
                    && item.password === password;
            });

            if (user) {
                localStorage.setItem("username", user.username);

                alert("✅ Login successful!");

                window.location.href = "dashboard.html";
            } else {
                alert("❌ Invalid username or password!");
            }
        }
    </script>

</body>
</html>
